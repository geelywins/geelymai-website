<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Geely MAI Studio</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f1b2d;--mut:#64748b;--line:#e3e8f0;--brand:#2563eb;--brand2:#1d4ed8;--soft:#eaf1ff;--ok:#059669;--warn:#d97706;--bad:#dc2626;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 50px -25px rgba(15,27,45,.25)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.lbox h1{font-size:22px;margin:18px 0 4px}
.lbox p{color:var(--mut);margin:0 0 16px}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{padding:4px 8px 16px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:#33445c;font-weight:600}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--soft);color:var(--brand2)}
nav .sp{height:1px;background:var(--line);margin:10px 4px}
nav small{display:block;padding:8px 12px 2px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
main{padding:26px clamp(14px,3vw,36px) 90px;max-width:1100px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:24px}
.top p{margin:2px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#c5cfdf}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand2)}
.btn.d{color:var(--bad)}
.btn.s{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* form */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
label.f small{display:block;color:var(--mut);margin-top:4px;font-size:12px;font-weight:400}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3ff;border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:14px}
.chk input{width:18px;height:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f{margin-bottom:16px}
.sub{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfe}
.sub .row{justify-content:space-between;margin-bottom:8px}
/* list items */
.item{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.item img,.ph{width:84px;height:62px;object-fit:cover;border-radius:9px;background:var(--soft);flex:none}
.ph{display:grid;place-items:center;color:var(--brand);font-weight:800}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand2)}
.tag.ok{background:#dcfce7;color:#047857}.tag.off{background:#f1f5f9;color:#64748b}.tag.hot{background:#fee2e2;color:#b91c1c}.tag.warn{background:#fef3c7;color:#b45309}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbox img{width:120px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:11px 18px;border-radius:12px;z-index:50;max-width:92vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.err{background:var(--bad)}
.note{background:#fff8e6;border:1px solid #fde3a3;border-radius:12px;padding:12px 14px;font-size:14px}
.note.b{background:var(--soft);border-color:#c8dcff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#94a3b8;margin-right:6px}
.dot.ok{background:var(--ok)}.dot.run{background:var(--warn)}.dot.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.szb{font-size:12px;color:#0b5cad;background:#eef5ff;border-radius:8px;padding:6px 9px;margin-top:6px}
.seohead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.seoi{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.seoi.ok b{color:var(--ok)}.seoi.no b{color:var(--bad)}
.seoi small{display:block;color:var(--mut);margin-top:2px}
.menu-btn{display:none}
@media(max-width:1000px){#ed2{grid-template-columns:1fr!important}}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-105%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 aside.open{transform:none}
 .menu-btn{display:inline-block}
 .two{grid-template-columns:1fr}
 .item{flex-wrap:wrap}
}
</style>
</head>
<body>

<section id="login">
  <div class="lbox">
    <div class="logo"><i>G</i> Geely MAI Studio</div>
    <h1>Masuk ke panel</h1>
    <p>Hubungkan panel ini ke repository GitHub website Anda. Data login hanya disimpan di browser ini.</p>
    <label class="f"><span>Username GitHub</span><input type="text" id="lo" autocapitalize="none" placeholder="contoh: geelywins"></label>
    <label class="f"><span>Nama repository</span><input type="text" id="lr" autocapitalize="none" placeholder="contoh: geely-mai"></label>
    <div class="two">
      <label class="f"><span>Branch</span><input type="text" id="lb" value="main" autocapitalize="none"></label>
      <span></span>
    </div>
    <label class="f"><span>Token GitHub</span><input type="password" id="lt" autocomplete="off" placeholder="github_pat_..."><small>Izin token: Contents, Actions, dan Workflows = Read and write, hanya untuk repo ini.</small></label>
    <button class="btn p" id="lgo" style="width:100%">Masuk</button>
  </div>
</section>

<div id="app" class="hide">
  <aside id="side">
    <div class="logo"><i>G</i> Geely MAI Studio</div>
    <nav id="nav">
      <button data-v="dash">🏠 Ringkasan</button>
      <small>Produk</small>
      <button data-v="models">🚗 Model &amp; Harga</button>
      <button data-v="promo">🏷️ Promo</button>
      <small>Konten &amp; SEO</small>
      <button data-v="artikel">📝 Artikel</button>
      <button data-v="seo">📈 SEO &amp; Ranking</button>
      <small>Tampilan</small>
      <button data-v="layout">🧩 Tata Letak Beranda</button>
      <button data-v="teks">✏️ Teks &amp; Komponen</button>
      <button data-v="slider">🖼️ Banner Beranda</button>
      <button data-v="testimoni">💬 Testimoni</button>
      <button data-v="delivery">🎁 Serah Terima</button>
      <small>Bisnis</small>
      <button data-v="leads">📇 Prospek</button>
      <button data-v="settings">⚙️ Pengaturan Situs</button>
      <button data-v="zip">📦 Upload ZIP</button>
      <div class="sp"></div>
      <button data-v="out">↩ Keluar</button>
    </nav>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="hide"></div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var BASE=location.pathname.replace(/\/admin\/(index\.html)?$/,'').replace(/\/$/,'');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slugify(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function img(p){return !p?'':/^(https?:)?\/\/|^data:|^blob:/.test(p)?p:(p.charAt(0)==='/'?BASE+p:p)}
var tt;function toast(m,err){var t=$('toast');t.textContent=m;t.className=err?'err':'';clearTimeout(tt);tt=setTimeout(function(){t.className='hide'},err?7000:3200)}
function b64(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
function unb64(s){var bin=atob(s.replace(/\n/g,'')),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a)}
function blobB64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)})}

/* ---------- GitHub ---------- */
function cfg(){return{o:LS.get('m_o'),r:LS.get('m_r'),b:LS.get('m_b')||'main',t:LS.get('m_t')}}
async function gh(path,opts){
  var c=cfg();
  var res=await fetch('https://api.github.com/repos/'+c.o+'/'+c.r+(path?'/'+path:''),Object.assign({headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'}},opts||{}));
  if(!res.ok){var d='';try{d=(await res.json()).message}catch(e){}
    var h=res.status===401?' (token salah atau kedaluwarsa)':res.status===403?' (token belum punya izin yang cukup)':res.status===404?' (cek username, nama repo, dan izin token)':res.status===409||res.status===422?' (data sudah berubah, muat ulang halaman ini)':'';
    var e=new Error('GitHub '+res.status+(d?': '+d:'')+h);e.status=res.status;throw e}
  return res.status===204?null:res.json();
}
var CACHE={};
async function load(name,fallback){
  try{var f=await gh('contents/src/data/'+name+'.json?ref='+encodeURIComponent(cfg().b));
    CACHE[name]={val:JSON.parse(unb64(f.content)),sha:f.sha};
  }catch(e){if(e.status!==404)throw e;CACHE[name]={val:fallback,sha:null}}
  return CACHE[name];
}
async function save(name,val,msg){
  var c=CACHE[name]||{};
  var body={message:msg||('Ubah '+name+' lewat panel'),content:b64(JSON.stringify(val,null,2)+'\n'),branch:cfg().b};
  if(c.sha)body.sha=c.sha;
  var r=await gh('contents/src/data/'+name+'.json',{method:'PUT',body:JSON.stringify(body)});
  CACHE[name]={val:val,sha:r.content.sha};
}
/* ---------- Form builder ---------- */
/* field: {k,l,t:text|area|num|sel|chk|color|img|date|strs|list, o:[...], f:[...], folder, h, req} */
function fld(f,v,path){
  var id='f_'+path.join('_');
  var hint=f.h?'<small>'+esc(f.h)+'</small>':'';
  if(f.t==='chk')return '<label class="chk"><input type="checkbox" data-p="'+path.join('.')+'" data-t="chk"'+(v?' checked':'')+'> '+esc(f.l)+'</label>';
  if(f.t==='area')return '<label class="f"><span>'+esc(f.l)+(f.req?' *':'')+'</span><textarea data-p="'+path.join('.')+'" data-t="text" rows="'+(f.rows||4)+'">'+esc(v)+'</textarea>'+hint+'</label>';
  if(f.t==='sel')return '<label class="f"><span>'+esc(f.l)+'</span><select data-p="'+path.join('.')+'" data-t="text">'+f.o.map(function(o){var ov=typeof o==='string'?o:o.v,ol=typeof o==='string'?o:o.l;return '<option value="'+esc(ov)+'"'+(String(v)===String(ov)?' selected':'')+'>'+esc(ol)+'</option>'}).join('')+'</select>'+hint+'</label>';
  if(f.t==='num')return '<label class="f"><span>'+esc(f.l)+'</span><input type="number" data-p="'+path.join('.')+'" data-t="num" value="'+esc(v)+'">'+hint+'</label>';
  if(f.t==='color')return '<label class="f"><span>'+esc(f.l)+'</span><input type="color" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v||'#2563eb')+'" style="width:70px;height:40px;padding:2px">'+hint+'</label>';
  if(f.t==='date')return '<label class="f"><span>'+esc(f.l)+'</span><input type="date" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v)+'">'+hint+'</label>';
  if(f.t==='img'){var sz=f.size?IMG[f.size]:null;
    return '<div class="f"><span style="display:block;font-weight:600;font-size:13px;margin-bottom:5px">'+esc(f.l)+(f.req?' *':'')+'</span><div class="imgbox" data-img="'+path.join('.')+'" data-folder="'+esc(f.folder||'umum')+'" data-sz="'+esc(f.size||'')+'">'+(v?'<img src="'+esc(img(v))+'" alt="">':'')+'<div><input type="hidden" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v)+'"><button type="button" class="btn s" data-up="1">'+(v?'Ganti foto':'Pilih foto')+'</button> '+(v?'<button type="button" class="btn s d" data-rm="1">Hapus</button>':'')+'<div class="szb">📐 '+esc(sz?sz.txt+' JPG, ±'+sz.kb+' KB. Rasio lain dipotong otomatis di tengah.':'Maks. 1600 px, otomatis dikecilkan.')+'</div></div></div></div>';}
  if(f.t==='strs'){
    var arr=Array.isArray(v)?v:[];
    return '<div class="f"><span style="display:block;font-weight:600;font-size:13px;margin-bottom:5px">'+esc(f.l)+'</span><div data-strs="'+path.join('.')+'">'+arr.map(function(s,i){return '<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input type="text" data-sp="'+i+'" value="'+esc(s)+'"><button type="button" class="btn s d" data-del="'+i+'">✕</button></div>'}).join('')+'</div><button type="button" class="btn s" data-addstr="'+path.join('.')+'">+ Tambah baris</button>'+hint+'</div>';
  }
  if(f.t==='list'){
    var L=Array.isArray(v)?v:[];
    return '<div class="f"><span style="display:block;font-weight:600;font-size:13px;margin-bottom:6px">'+esc(f.l)+'</span><div data-list="'+path.join('.')+'">'+L.map(function(it,i){
      return '<div class="sub"><div class="row"><b>#'+(i+1)+'</b><button type="button" class="btn s d" data-dellist="'+path.join('.')+':'+i+'">Hapus</button></div>'+f.f.map(function(sf){return fld(sf,it[sf.k],path.concat([i,sf.k]))}).join('')+'</div>'}).join('')+'</div><button type="button" class="btn s" data-addlist="'+path.join('.')+'">+ '+esc(f.add||'Tambah')+'</button>'+hint+'</div>';
  }
  return '<label class="f"><span>'+esc(f.l)+(f.req?' *':'')+'</span><input type="text" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v)+'" autocapitalize="none">'+hint+'</label>';
}
function getP(o,p){return p.reduce(function(a,k){return a==null?a:a[k]},o)}
function setP(o,p,v){for(var i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]=(/^\d+$/.test(p[i+1])?[]:{});o=o[p[i]]}o[p[p.length-1]]=v}
function parsePath(s){return s.split('.').map(function(x){return /^\d+$/.test(x)?+x:x})}
/* baca nilai form ke objek */
function collect(root,obj){
  root.querySelectorAll('[data-p]').forEach(function(el){
    var p=parsePath(el.getAttribute('data-p')),t=el.getAttribute('data-t'),v;
    if(t==='chk')v=el.checked;else if(t==='num')v=el.value===''?'':Number(el.value);else v=el.value;
    setP(obj,p,v);
  });
  root.querySelectorAll('[data-strs]').forEach(function(box){
    var p=parsePath(box.getAttribute('data-strs'));
    setP(obj,p,[].map.call(box.querySelectorAll('[data-sp]'),function(i){return i.value.trim()}).filter(Boolean));
  });
  return obj;
}
function bindForm(root,getObj,rerender,fields){
  root.onclick=async function(e){
    var el=e.target.closest('button');if(!el)return;
    var cur=function(){return collect(root,getObj())};
    if(el.dataset.addstr){var o=cur(),p=parsePath(el.dataset.addstr),a=getP(o,p)||[];a.push('');setP(o,p,a);rerender(o)}
    else if(el.dataset.del!==undefined){var box=el.closest('[data-strs]'),o2=cur(),p2=parsePath(box.getAttribute('data-strs')),a2=getP(o2,p2)||[];a2.splice(+el.dataset.del,1);setP(o2,p2,a2);rerender(o2)}
    else if(el.dataset.addlist){var o3=cur(),p3=parsePath(el.dataset.addlist),a3=getP(o3,p3)||[],def=findField(fields,p3);a3.push(blankOf(def));setP(o3,p3,a3);rerender(o3)}
    else if(el.dataset.dellist){var pr=el.dataset.dellist.split(':'),o4=cur(),p4=parsePath(pr[0]),a4=getP(o4,p4)||[];a4.splice(+pr[1],1);setP(o4,p4,a4);rerender(o4)}
    else if(el.dataset.up){var bx=el.closest('[data-img]');var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.onchange=async function(){if(!inp.files[0])return;el.disabled=true;el.textContent='Mengunggah...';
        try{var u=await uploadImage(inp.files[0],bx.dataset.folder,bx.dataset.sz?IMG[bx.dataset.sz]:null);bx.querySelector('[data-p]').value=u.url;if(u.warn.length)toast('Foto diunggah ('+u.info+'). '+u.warn.join(' '));var o5=cur();rerender(o5)}catch(er){toast(er.message,1);el.disabled=false;el.textContent='Pilih foto'}};inp.click()}
    else if(el.dataset.rm){var bx2=el.closest('[data-img]');bx2.querySelector('[data-p]').value='';rerender(cur())}
  };
}
function findField(fields,path){
  var cur=null,list=fields;
  for(var i=0;i<path.length;i++){if(typeof path[i]==='number')continue;var f=(list||[]).filter(function(x){return x.k===path[i]})[0];if(!f)return null;cur=f;list=f.f}
  return cur;
}
function blankOf(f){var o={};(f.f||[]).forEach(function(x){o[x.k]=x.t==='chk'?!!x.def:x.t==='strs'||x.t==='list'?[]:(x.def!=null?x.def:'')});return o}
function formHTML(fields,obj){return fields.map(function(f){return fld(f,obj[f.k],[f.k])}).join('')}

/* ---------- Skema ---------- */
var MODELS_SEL=[];
var S={
  models:[
    {k:'nama',l:'Nama model',req:1},
    {k:'tipe',l:'Jenis (contoh: SUV Listrik)'},
    {k:'harga',l:'Teks harga yang tampil',h:'Contoh: "Mulai Rp 239.900.000 OTR Jakarta (Oktober 2026)" atau "Hubungi sales untuk harga terbaru". Cek ulang tiap bulan.'},
    {k:'ringkas',l:'Ringkasan satu kalimat',t:'area',rows:2},
    {k:'deskripsi',l:'Deskripsi',t:'area',rows:5},
    {k:'keunggulan',l:'Keunggulan',t:'strs'},
    {k:'spesifikasi',l:'Spesifikasi',t:'list',add:'Tambah baris spesifikasi',f:[{k:'label',l:'Nama (contoh: Baterai)'},{k:'nilai',l:'Isi'}]},
    {k:'foto',l:'Foto utama',t:'img',folder:'model',size:'model'},
    {k:'warna',l:'Warna aksen',t:'color'},
    {k:'link3d',l:'Link tampilan 3D (opsional)'}
  ],
  promo:[
    {k:'judul',l:'Judul promo',req:1},
    {k:'deskripsi',l:'Isi promo',t:'area',rows:4},
    {k:'periode',l:'Periode berlaku',h:'Contoh: Berlaku sampai 31 Oktober 2026'},
    {k:'model',l:'Model terkait',t:'sel',o:'MODELS'},
    {k:'foto',l:'Gambar promo',t:'img',folder:'promo',size:'promo'},
    {k:'aktif',l:'Tampilkan di website',t:'chk',def:true}
  ],

async function uploadImage(file,folder,size){
  var url=URL.createObjectURL(file),im=new Image();
  await new Promise(function(r,j){im.onload=r;im.onerror=function(){j(new Error('File bukan gambar yang valid'))};im.src=url});
  var sw=im.naturalWidth,sh=im.naturalHeight,warn=[],cw,ch,sx=0,sy=0,sW=sw,sH=sh;
  if(size){
    var tr=size.w/size.h,r=sw/sh;
    if(sw<size.w*0.9||sh<size.h*0.9)warn.push('Foto asli '+sw+'x'+sh+' lebih kecil dari ukuran ideal '+size.w+'x'+size.h+', hasil bisa kurang tajam.');
    if(Math.abs(r-tr)/tr>0.04){warn.push('Rasio foto disesuaikan otomatis (dipotong di bagian tengah) menjadi '+size.w+'x'+size.h+'.');
      if(r>tr){sW=Math.round(sh*tr);sx=Math.round((sw-sW)/2)}else{sH=Math.round(sw/tr);sy=Math.round((sh-sH)/2)}}
    var k=Math.min(1,size.w/sW);cw=Math.round(sW*k);ch=Math.round(sH*k);
  }else{var kk=Math.min(1,1600/Math.max(sw,sh));cw=Math.round(sw*kk);ch=Math.round(sh*kk)}
  var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  cv.getContext('2d').drawImage(im,sx,sy,sW,sH,0,0,cw,ch);URL.revokeObjectURL(url);
  var blob=await new Promise(function(r){cv.toBlob(r,'image/jpeg',.84)});
  if(!blob)throw new Error('Gagal memproses gambar');
  if(size&&size.kb&&blob.size>size.kb*1024*1.6)warn.push('Ukuran file '+Math.round(blob.size/1024)+' KB, lebih besar dari ideal ±'+size.kb+' KB (bisa memperlambat halaman).');
  var name=(slugify(file.name.replace(/\.[^.]+$/,''))||'foto')+'-'+Date.now().toString(36)+'.jpg';
  await gh('contents/public/images/'+folder+'/'+name,{method:'PUT',body:JSON.stringify({message:'Unggah foto '+name,content:await blobB64(blob),branch:cfg().b})});
  return {url:'/images/'+folder+'/'+name,info:cw+' x '+ch+' px, '+Math.round(blob.size/1024)+' KB',warn:warn};
}

function seoBox(r){

  r.items.slice().sort(function(a,b){return (a.ok?1:0)-(b.ok?1:0)}).map(function(i){return '<div class="seoi '+(i.ok?'ok':'no')+'"><b>'+(i.ok?'✔ ':'✖ ')+esc(i.label)+'</b>'+(i.ok?'':'<small>'+esc(i.tip)+'</small>')+'</div>'}).join('');
}
function parseMd(t){
  var m=t.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/),fm={};
  if(!m)return {fm:fm,body:t};
  m[1].split(/\r?\n/).forEach(function(l){var k=l.match(/^(\w+):\s*(.*)$/);if(!k)return;var v=k[2].trim();
    try{if(/^["\[]/.test(v))v=JSON.parse(v);else if(v==='true')v=true;else if(v==='false')v=false}catch(e){}fm[k[1]]=v});
  return {fm:fm,body:m[2].replace(/^\n+/,'')};
}
function toMd(a){
  var fm=['---','title: '+JSON.stringify(a.title),'description: '+JSON.stringify(a.description),'date: '+a.date,'category: '+JSON.stringify(a.category||'Info Geely'),'tags: '+JSON.stringify(a.tags||[])];
  if(a.image)fm.push('image: '+JSON.stringify(a.image));
  fm.push('draft: '+(a.draft?'true':'false'),'---','');

      var out={title:v.title,description:v.description,category:v.category||'Info Geely',tags:v.tags,image:v.image,body:v.body,draft:s==='draft',date:s==='terjadwal'?d:(isNew||a.draft||a.date>todayWIB()?todayWIB():a.date)};
      var r=seoAnalyze(v,ARTS);
      if(s!=='draft'&&r.score<60&&!confirm('Skor SEO baru '+r.score+'/100. Tetap '+(s==='terbit'?'terbitkan':'jadwalkan')+'?'))return;
      busy(this);
      try{var path='src/content/artikel/'+v.slug+'.md',sha;
        try{sha=(await gh('contents/'+path+'?ref='+encodeURIComponent(cfg().b))).sha}catch(e2){if(e2.status!==404)throw e2}
        if(isNew&&sha){toast('Alamat artikel sudah dipakai',1);idle(this);return}
        var body={message:(isNew?'Artikel baru: ':'Ubah artikel: ')+v.title,content:b64(toMd(out)),branch:cfg().b};if(sha)body.sha=sha;
        await gh('contents/'+path,{method:'PUT',body:JSON.stringify(body)});
        var rec=Object.assign({slug:v.slug},out);var ix=ARTS.findIndex(function(x){return x.slug===v.slug});if(ix>=0)ARTS[ix]=rec;else ARTS.push(rec);
        toast(s==='draft'?'Draft tersimpan':s==='terjadwal'?'Terjadwal untuk '+d:'Tersimpan. Website dibangun ulang (±3 menit).');list();
      }catch(e){toast(e.message,1);idle(this)}
    };
  }
  list();
}

var GRP_LABEL={beranda:'Beranda',halamanModel:'Halaman Model',halamanPromo:'Halaman Promo',halamanArtikel:'Halaman Artikel',halamanTestimoni:'Halaman Testimoni',halamanDelivery:'Halaman Serah Terima',kontak:'Halaman Kontak',footer:'Footer',popup:'Popup Promo'};
var KEY_LABEL={stats:'Angka sorotan',modelJudul:'Judul bagian model',modelTeks:'Teks bagian model',promoJudul:'Judul bagian promo',promoTeks:'Teks bagian promo',deliveryJudul:'Judul serah terima',deliveryTeks:'Teks serah terima',testimoniJudul:'Judul testimoni',testimoniTeks:'Teks testimoni',keunggulanJudul:'Judul keunggulan',keunggulan:'Daftar keunggulan',artikelJudul:'Judul artikel',artikelTeks:'Teks artikel',faqJudul:'Judul FAQ',faq:'Daftar FAQ',ctaJudul:'Judul ajakan',ctaTeks:'Teks ajakan',ctaTombol:'Tombol ajakan',seoJudul:'Judul untuk Google',seoDeskripsi:'Deskripsi untuk Google (maks 160)',judul:'Judul halaman',teks:'Teks pengantar',kosong:'Tulisan jika data kosong',layananJudul:'Judul layanan',layanan:'Daftar layanan',catatan:'Catatan footer',aktif:'Aktifkan',tundaDetik:'Muncul setelah (detik)',label:'Label',foto:'Gambar',tombol:'Teks tombol',link:'Tujuan tombol',angka:'Angka/judul',tanya:'Pertanyaan',jawab:'Jawaban',ikon:'Ikon (emoji)'};
function autoFields(def,cur){
  return Object.keys(def).map(function(k){
    var v=def[k],l=KEY_LABEL[k]||k,sample=cur&&cur[k]!==undefined?cur[k]:v;
    if(typeof v==='boolean')return {k:k,l:l,t:'chk'};
    if(typeof v==='number')return {k:k,l:l,t:'num'};
    if(Array.isArray(v)){
      if(v.length&&typeof v[0]==='object')return {k:k,l:l,t:'list',add:'Tambah',f:autoFields(v[0],(Array.isArray(sample)?sample[0]:null))};
      return {k:k,l:l,t:'strs'};
    }
    if(typeof v==='string'){
      if(k==='foto')return {k:k,l:l,t:'img',folder:'umum',size:'popup'};
      var long=v.length>80||/\n/.test(v)||/Teks|teks|deskripsi|Deskripsi|jawab/.test(k);
      return {k:k,l:l,t:long?'area':'text',rows:3};
    }
    return {k:k,l:l};
  });
}

}

function go(v){
  if(v==='out'){['m_o','m_r','m_b','m_t'].forEach(LS.del);CACHE={};$('app').classList.add('hide');$('login').classList.remove('hide');return}
  VIEW=v;$('side').classList.remove('open');
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='dash')vDash();else if(v==='settings')vSettings();else if(v==='leads')vLeads();else if(v==='artikel')vArtikel();else if(v==='layout')vLayout();else if(v==='teks')vTeks();else if(v==='seo')vSeo();else if(v==='zip')vZip();
  else vColl(v,TITLES[v][0],TITLES[v][1]);
  window.scrollTo(0,0);
}
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.v)});

function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');go('dash')}
$('lgo').onclick=async function(){

};
(function init(){

  if(c.o&&c.r&&c.t)showApp();
})();
})();
