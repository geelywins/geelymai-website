<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Geely MAI Studio</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f1b2d;--mut:#64748b;--line:#e3e8f0;--brand:#2563eb;--brand2:#1d4ed8;--soft:#eaf1ff;--ok:#059669;--warn:#d97706;--bad:#dc2626;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 50px -25px rgba(15,27,45,.25)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.lbox h1{font-size:22px;margin:18px 0 4px}
.lbox p{color:var(--mut);margin:0 0 16px}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{padding:4px 8px 16px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:#33445c;font-weight:600}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--soft);color:var(--brand2)}
nav .sp{height:1px;background:var(--line);margin:10px 4px}
nav small{display:block;padding:8px 12px 2px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
main{padding:26px clamp(14px,3vw,36px) 90px;max-width:1100px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:24px}
.top p{margin:2px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#c5cfdf}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand2)}
.btn.d{color:var(--bad)}
.btn.s{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* form */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
label.f small{display:block;color:var(--mut);margin-top:4px;font-size:12px;font-weight:400}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3ff;border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:14px}
.chk input{width:18px;height:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f{margin-bottom:16px}
.sub{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfe}
.sub .row{justify-content:space-between;margin-bottom:8px}
/* list items */
.item{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.item img,.ph{width:84px;height:62px;object-fit:cover;border-radius:9px;background:var(--soft);flex:none}
.ph{display:grid;place-items:center;color:var(--brand);font-weight:800}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand2)}
.tag.ok{background:#dcfce7;color:#047857}.tag.off{background:#f1f5f9;color:#64748b}.tag.hot{background:#fee2e2;color:#b91c1c}.tag.warn{background:#fef3c7;color:#b45309}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbox img{width:120px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:11px 18px;border-radius:12px;z-index:50;max-width:92vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.err{background:var(--bad)}
.note{background:#fff8e6;border:1px solid #fde3a3;border-radius:12px;padding:12px 14px;font-size:14px}
.note.b{background:var(--soft);border-color:#c8dcff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#94a3b8;margin-right:6px}
.dot.ok{background:var(--ok)}.dot.run{background:var(--warn)}.dot.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.menu-btn{display:none}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-105%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 aside.open{transform:none}
 .menu-btn{display:inline-block}
 .two{grid-template-columns:1fr}
 .item{flex-wrap:wrap}
}
</style>
</head>
<body>

<section id="login">
  <div class="lbox">
    <div class="logo"><i>G</i> Geely MAI Studio</div>
    <h1>Masuk ke panel</h1>
    <p>Hubungkan panel ini ke repository GitHub website Anda. Data login hanya disimpan di browser ini.</p>
    <label class="f"><span>Username GitHub</span><input type="text" id="lo" autocapitalize="none" placeholder="contoh: geelywins"></label>
    <label class="f"><span>Nama repository</span><input type="text" id="lr" autocapitalize="none" placeholder="contoh: geely-mai"></label>
    <div class="two">
      <label class="f"><span>Branch</span><input type="text" id="lb" value="main" autocapitalize="none"></label>
      <span></span>
    </div>
    <label class="f"><span>Token GitHub</span><input type="password" id="lt" autocomplete="off" placeholder="github_pat_..."><small>Izin token: Contents, Actions, dan Workflows = Read and write, hanya untuk repo ini.</small></label>
    <button class="btn p" id="lgo" style="width:100%">Masuk</button>
  </div>
</section>

<div id="app" class="hide">
  <aside id="side">
    <div class="logo"><i>G</i> Geely MAI Studio</div>
    <nav id="nav">
      <button data-v="dash">🏠 Ringkasan</button>
      <small>Produk</small>
      <button data-v="models">🚗 Model &amp; Harga</button>
      <button data-v="promo">🏷️ Promo</button>
      <small>Tampilan</small>
      <button data-v="slider">🖼️ Banner Beranda</button>
      <button data-v="testimoni">💬 Testimoni</button>
      <button data-v="delivery">🎁 Serah Terima</button>
      <small>Bisnis</small>
      <button data-v="leads">📇 Prospek</button>
      <button data-v="settings">⚙️ Pengaturan Situs</button>
      <button data-v="zip">📦 Upload ZIP</button>
      <div class="sp"></div>
      <button data-v="out">↩ Keluar</button>
    </nav>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="hide"></div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var BASE=location.pathname.replace(/\/admin\/(index\.html)?$/,'').replace(/\/$/,'');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slugify(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function img(p){return !p?'':/^(https?:)?\/\/|^data:|^blob:/.test(p)?p:(p.charAt(0)==='/'?BASE+p:p)}
var tt;function toast(m,err){var t=$('toast');t.textContent=m;t.className=err?'err':'';clearTimeout(tt);tt=setTimeout(function(){t.className='hide'},err?7000:3200)}
function b64(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
function unb64(s){var bin=atob(s.replace(/\n/g,'')),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a)}
function blobB64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)})}

/* ---------- GitHub ---------- */
function cfg(){return{o:LS.get('m_o'),r:LS.get('m_r'),b:LS.get('m_b')||'main',t:LS.get('m_t')}}
async function gh(path,opts){
  var c=cfg();
  var res=await fetch('https://api.github.com/repos/'+c.o+'/'+c.r+(path?'/'+path:''),Object.assign({headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'}},opts||{}));
  if(!res.ok){var d='';try{d=(await res.json()).message}catch(e){}
    var h=res.status===401?' (token salah atau kedaluwarsa)':res.status===403?' (token belum punya izin yang cukup)':res.status===404?' (cek username, nama repo, dan izin token)':res.status===409||res.status===422?' (data sudah berubah, muat ulang halaman ini)':'';
    var e=new Error('GitHub '+res.status+(d?': '+d:'')+h);e.status=res.status;throw e}
  return res.status===204?null:res.json();
}
var CACHE={};
async function load(name,fallback){
  try{var f=await gh('contents/src/data/'+name+'.json?ref='+encodeURIComponent(cfg().b));
    CACHE[name]={val:JSON.parse(unb64(f.content)),sha:f.sha};
  }catch(e){if(e.status!==404)throw e;CACHE[name]={val:fallback,sha:null}}
  return CACHE[name];
}
async function save(name,val,msg){
  var c=CACHE[name]||{};
  var body={message:msg||('Ubah '+name+' lewat panel'),content:b64(JSON.stringify(val,null,2)+'\n'),branch:cfg().b};
  if(c.sha)body.sha=c.sha;
  var r=await gh('contents/src/data/'+name+'.json',{method:'PUT',body:JSON.stringify(body)});
  CACHE[name]={val:val,sha:r.content.sha};
}
async function uploadImage(file,folder){
  var url=URL.createObjectURL(file),im=new Image();
  await new Promise(function(r,j){im.onload=r;im.onerror=j;im.src=url});
  var w=im.naturalWidth,h=im.naturalHeight,m=1600,k=Math.min(1,m/Math.max(w,h));
  var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  var blob=await new Promise(function(r){cv.toBlob(r,'image/jpeg',.86)});
  if(!blob)throw new Error('Gagal memproses gambar');
  var name=(slugify(file.name.replace(/\.[^.]+$/,''))||'foto')+'-'+Date.now().toString(36)+'.jpg';
  await gh('contents/public/images/'+folder+'/'+name,{method:'PUT',body:JSON.stringify({message:'Unggah foto '+name,content:await blobB64(blob),branch:cfg().b})});
  return '/images/'+folder+'/'+name;
}

/* ---------- Form builder ---------- */
/* field: {k,l,t:text|area|num|sel|chk|color|img|date|strs|list, o:[...], f:[...], folder, h, req} */
function fld(f,v,path){
  var id='f_'+path.join('_');
  var hint=f.h?'<small>'+esc(f.h)+'</small>':'';
  if(f.t==='chk')return '<label class="chk"><input type="checkbox" data-p="'+path.join('.')+'" data-t="chk"'+(v?' checked':'')+'> '+esc(f.l)+'</label>';
  if(f.t==='area')return '<label class="f"><span>'+esc(f.l)+(f.req?' *':'')+'</span><textarea data-p="'+path.join('.')+'" data-t="text" rows="'+(f.rows||4)+'">'+esc(v)+'</textarea>'+hint+'</label>';
  if(f.t==='sel')return '<label class="f"><span>'+esc(f.l)+'</span><select data-p="'+path.join('.')+'" data-t="text">'+f.o.map(function(o){var ov=typeof o==='string'?o:o.v,ol=typeof o==='string'?o:o.l;return '<option value="'+esc(ov)+'"'+(String(v)===String(ov)?' selected':'')+'>'+esc(ol)+'</option>'}).join('')+'</select>'+hint+'</label>';
  if(f.t==='num')return '<label class="f"><span>'+esc(f.l)+'</span><input type="number" data-p="'+path.join('.')+'" data-t="num" value="'+esc(v)+'">'+hint+'</label>';
  if(f.t==='color')return '<label class="f"><span>'+esc(f.l)+'</span><input type="color" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v||'#2563eb')+'" style="width:70px;height:40px;padding:2px">'+hint+'</label>';
  if(f.t==='date')return '<label class="f"><span>'+esc(f.l)+'</span><input type="date" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v)+'">'+hint+'</label>';
  if(f.t==='img')return '<div class="f label f"><span style="display:block;font-weight:600;font-size:13px;margin-bottom:5px">'+esc(f.l)+(f.req?' *':'')+'</span><div class="imgbox" data-img="'+path.join('.')+'" data-folder="'+esc(f.folder||'umum')+'">'+(v?'<img src="'+esc(img(v))+'" alt="">':'')+'<div><input type="hidden" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v)+'"><button type="button" class="btn s" data-up="1">'+(v?'Ganti foto':'Pilih foto')+'</button> '+(v?'<button type="button" class="btn s d" data-rm="1">Hapus</button>':'')+'<small style="display:block;color:var(--mut);margin-top:4px">'+esc(f.h||'JPG/PNG, otomatis dikecilkan')+'</small></div></div></div><div style="height:6px"></div>';
  if(f.t==='strs'){
    var arr=Array.isArray(v)?v:[];
    return '<div class="f"><span style="display:block;font-weight:600;font-size:13px;margin-bottom:5px">'+esc(f.l)+'</span><div data-strs="'+path.join('.')+'">'+arr.map(function(s,i){return '<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input type="text" data-sp="'+i+'" value="'+esc(s)+'"><button type="button" class="btn s d" data-del="'+i+'">✕</button></div>'}).join('')+'</div><button type="button" class="btn s" data-addstr="'+path.join('.')+'">+ Tambah baris</button>'+hint+'</div>';
  }
  if(f.t==='list'){
    var L=Array.isArray(v)?v:[];
    return '<div class="f"><span style="display:block;font-weight:600;font-size:13px;margin-bottom:6px">'+esc(f.l)+'</span><div data-list="'+path.join('.')+'">'+L.map(function(it,i){
      return '<div class="sub"><div class="row"><b>#'+(i+1)+'</b><button type="button" class="btn s d" data-dellist="'+path.join('.')+':'+i+'">Hapus</button></div>'+f.f.map(function(sf){return fld(sf,it[sf.k],path.concat([i,sf.k]))}).join('')+'</div>'}).join('')+'</div><button type="button" class="btn s" data-addlist="'+path.join('.')+'">+ '+esc(f.add||'Tambah')+'</button>'+hint+'</div>';
  }
  return '<label class="f"><span>'+esc(f.l)+(f.req?' *':'')+'</span><input type="text" data-p="'+path.join('.')+'" data-t="text" value="'+esc(v)+'" autocapitalize="none">'+hint+'</label>';
}
function getP(o,p){return p.reduce(function(a,k){return a==null?a:a[k]},o)}
function setP(o,p,v){for(var i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]=(/^\d+$/.test(p[i+1])?[]:{});o=o[p[i]]}o[p[p.length-1]]=v}
function parsePath(s){return s.split('.').map(function(x){return /^\d+$/.test(x)?+x:x})}
/* baca nilai form ke objek */
function collect(root,obj){
  root.querySelectorAll('[data-p]').forEach(function(el){
    var p=parsePath(el.getAttribute('data-p')),t=el.getAttribute('data-t'),v;
    if(t==='chk')v=el.checked;else if(t==='num')v=el.value===''?'':Number(el.value);else v=el.value;
    setP(obj,p,v);
  });
  root.querySelectorAll('[data-strs]').forEach(function(box){
    var p=parsePath(box.getAttribute('data-strs'));
    setP(obj,p,[].map.call(box.querySelectorAll('[data-sp]'),function(i){return i.value.trim()}).filter(Boolean));
  });
  return obj;
}
function bindForm(root,getObj,rerender,fields){
  root.onclick=async function(e){
    var el=e.target.closest('button');if(!el)return;
    var cur=function(){return collect(root,getObj())};
    if(el.dataset.addstr){var o=cur(),p=parsePath(el.dataset.addstr),a=getP(o,p)||[];a.push('');setP(o,p,a);rerender(o)}
    else if(el.dataset.del!==undefined){var box=el.closest('[data-strs]'),o2=cur(),p2=parsePath(box.getAttribute('data-strs')),a2=getP(o2,p2)||[];a2.splice(+el.dataset.del,1);setP(o2,p2,a2);rerender(o2)}
    else if(el.dataset.addlist){var o3=cur(),p3=parsePath(el.dataset.addlist),a3=getP(o3,p3)||[],def=findField(fields,p3);a3.push(blankOf(def));setP(o3,p3,a3);rerender(o3)}
    else if(el.dataset.dellist){var pr=el.dataset.dellist.split(':'),o4=cur(),p4=parsePath(pr[0]),a4=getP(o4,p4)||[];a4.splice(+pr[1],1);setP(o4,p4,a4);rerender(o4)}
    else if(el.dataset.up){var bx=el.closest('[data-img]');var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.onchange=async function(){if(!inp.files[0])return;el.disabled=true;el.textContent='Mengunggah...';
        try{var u=await uploadImage(inp.files[0],bx.dataset.folder);bx.querySelector('[data-p]').value=u;var o5=cur();rerender(o5)}catch(er){toast(er.message,1);el.disabled=false;el.textContent='Pilih foto'}};inp.click()}
    else if(el.dataset.rm){var bx2=el.closest('[data-img]');bx2.querySelector('[data-p]').value='';rerender(cur())}
  };
}
function findField(fields,path){
  var cur=null,list=fields;
  for(var i=0;i<path.length;i++){if(typeof path[i]==='number')continue;var f=(list||[]).filter(function(x){return x.k===path[i]})[0];if(!f)return null;cur=f;list=f.f}
  return cur;
}
function blankOf(f){var o={};(f.f||[]).forEach(function(x){o[x.k]=x.t==='chk'?!!x.def:x.t==='strs'||x.t==='list'?[]:(x.def!=null?x.def:'')});return o}
function formHTML(fields,obj){return fields.map(function(f){return fld(f,obj[f.k],[f.k])}).join('')}

/* ---------- Skema ---------- */
var MODELS_SEL=[];
var S={
  models:[
    {k:'nama',l:'Nama model',req:1},
    {k:'tipe',l:'Jenis (contoh: SUV Listrik)'},
    {k:'harga',l:'Teks harga yang tampil',h:'Contoh: "Mulai Rp 239.900.000 OTR Jakarta (Oktober 2026)" atau "Hubungi sales untuk harga terbaru". Cek ulang tiap bulan.'},
    {k:'ringkas',l:'Ringkasan satu kalimat',t:'area',rows:2},
    {k:'deskripsi',l:'Deskripsi',t:'area',rows:5},
    {k:'keunggulan',l:'Keunggulan',t:'strs'},
    {k:'spesifikasi',l:'Spesifikasi',t:'list',add:'Tambah baris spesifikasi',f:[{k:'label',l:'Nama (contoh: Baterai)'},{k:'nilai',l:'Isi'}]},
    {k:'foto',l:'Foto utama',t:'img',folder:'model'},
    {k:'warna',l:'Warna aksen',t:'color'},
    {k:'link3d',l:'Link tampilan 3D (opsional)'}
  ],
  promo:[
    {k:'judul',l:'Judul promo',req:1},
    {k:'deskripsi',l:'Isi promo',t:'area',rows:4},
    {k:'periode',l:'Periode berlaku',h:'Contoh: Berlaku sampai 31 Oktober 2026'},
    {k:'model',l:'Model terkait',t:'sel',o:'MODELS'},
    {k:'foto',l:'Gambar promo',t:'img',folder:'promo'},
    {k:'aktif',l:'Tampilkan di website',t:'chk',def:true}
  ],
  slider:[
    {k:'label',l:'Label kecil di atas judul'},
    {k:'judul',l:'Judul',req:1,h:'Bungkus kata sorot dengan kurung kurawal, contoh: Mobil {Geely} masa kini'},
    {k:'teks',l:'Teks pendek',t:'area',rows:3},
    {k:'tombol',l:'Tombol utama (teks)'},

function resolveSel(fields){
  return fields.map(function(f){
    if(f.o==='MODELS')return Object.assign({},f,{o:[{v:'',l:'- tidak dipilih -'}].concat(MODELS_SEL.map(function(m){return{v:m.slug,l:m.nama}}))});
    return f;
  });
}

/* ---------- Views ---------- */
var main=$('main'),VIEW='dash';
function head(t,p,right){return '<div class="top"><div class="row"><button class="btn menu-btn" id="mb">☰</button><div><h2>'+t+'</h2>'+(p?'<p>'+p+'</p>':'')+'</div></div><div class="row">'+(right||'')+'</div></div>'}
function bindMenu(){var b=$('mb');if(b)b.onclick=function(){$('side').classList.toggle('open')}}
function busy(btn,txt){btn.disabled=true;btn.dataset.o=btn.textContent;btn.textContent=txt||'Menyimpan...'}
function idle(btn){btn.disabled=false;btn.textContent=btn.dataset.o||btn.textContent}

async function vDash(){
  main.innerHTML=head('Ringkasan','Selamat datang di panel Geely MAI')+'<div class="card">Memuat...</div>';bindMenu();
  try{
    var r=await Promise.all([load('models',[]),load('promo',[]),load('slider',[]),load('testimoni',[]),load('delivery',[])]);
    var runs=null;try{runs=await gh('actions/runs?per_page=1')}catch(e){}
    var run=runs&&runs.workflow_runs&&runs.workflow_runs[0];
    var st=!run?'<span class="dot"></span>Belum ada proses build':run.status!=='completed'?'<span class="dot run"></span>Sedang membangun website...':run.conclusion==='success'?'<span class="dot ok"></span>Website terbaru sudah tayang':'<span class="dot bad"></span>Build gagal, buka tab Actions di GitHub';
    var c=cfg(),site='https://'+c.o+'.github.io/'+c.r+'/';
    var lead=JSON.parse(LS.get('m_leads')||'[]');
    main.innerHTML=head('Ringkasan','Selamat datang di panel Geely MAI','<a class="btn" target="_blank" rel="noopener" href="'+esc(site)+'">Buka website ↗</a>')+
    '<div class="card" style="margin-bottom:14px">'+st+(run?' <span style="color:var(--mut)">· '+esc(new Date(run.updated_at).toLocaleString('id-ID'))+'</span>':'')+' <button class="btn s" id="rb" style="float:right">Bangun ulang website</button></div>'+
    '<div class="grid g4" style="margin-bottom:14px">'+
    [['Model',r[0].val.length],['Promo aktif',r[1].val.filter(function(x){return x.aktif!==false}).length],['Banner',r[2].val.length],['Testimoni',r[3].val.length],['Serah terima',r[4].val.length],['Prospek',lead.length]].map(function(x){return '<div class="card stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('')+'</div>'+
    (!JSON.stringify(CACHE.models.val).match(/Rp\s?\d/)?'<div class="note">Harga di model belum diisi angka. Isi di menu Model &amp; Harga setelah Anda memverifikasi harga terbaru.</div>':'');
    bindMenu();
    $('rb').onclick=async function(){busy(this,'Memulai...');try{await gh('actions/workflows/deploy.yml/dispatches',{method:'POST',body:JSON.stringify({ref:cfg().b})});toast('Build dimulai. Tunggu 2-5 menit.')}catch(e){toast(e.message,1)}idle(this)};
  }catch(e){main.innerHTML=head('Ringkasan','')+'<div class="note">'+esc(e.message)+'</div>';bindMenu()}
}

/* editor koleksi (array) */
async function vColl(name,title,sub,opt){
  opt=opt||{};
  main.innerHTML=head(title,sub)+'<div class="card">Memuat...</div>';bindMenu();
  try{
    if(name!=='models')await load('models',[]).then(function(m){MODELS_SEL=m.val});
    var d=await load(name,[]);if(name==='models')MODELS_SEL=d.val;
    var arr=d.val;
    function titleOf(it){return it.nama||it.judul||it.label||'(tanpa judul)'}
    function listView(){
      main.innerHTML=head(title,sub,opt.noAdd?'':'<button class="btn p" id="add">+ Tambah</button>')+
      (arr.length?arr.map(function(it,i){
        var ph=it.foto?'<img src="'+esc(img(it.foto))+'" alt="">':'<div class="ph">'+esc(titleOf(it).charAt(0).toUpperCase())+'</div>';
        var sec=it.harga||it.periode||it.keterangan||it.tipe||it.teks||'';
        return '<div class="item">'+ph+'<div class="t"><b>'+esc(titleOf(it))+'</b><span>'+esc(String(sec).slice(0,90))+'</span></div>'+
        (it.aktif===undefined?'':'<span class="tag '+(it.aktif?'ok':'off')+'">'+(it.aktif?'Tampil':'Sembunyi')+'</span>')+
        '<div class="row"><button class="btn s" data-mv="-1:'+i+'">↑</button><button class="btn s" data-mv="1:'+i+'">↓</button><button class="btn s" data-ed="'+i+'">Ubah</button><button class="btn s d" data-rmv="'+i+'">Hapus</button></div></div>'}).join(''):'<div class="card" style="text-align:center;color:var(--mut)">Belum ada data. Klik "+ Tambah".</div>');
      bindMenu();
      var a=$('add');if(a)a.onclick=function(){edit(-1)};
      main.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){edit(+b.dataset.ed)}});
      main.querySelectorAll('[data-rmv]').forEach(function(b){b.onclick=async function(){
        var i=+b.dataset.rmv;if(!confirm('Hapus "'+titleOf(arr[i])+'"?'))return;
        var nv=arr.slice();nv.splice(i,1);try{await save(name,nv,'Hapus '+name);arr=nv;toast('Terhapus');listView()}catch(e){toast(e.message,1)}}});
      main.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=async function(){
        var p=b.dataset.mv.split(':'),dir=+p[0],i=+p[1],j=i+dir;if(j<0||j>=arr.length)return;
        var nv=arr.slice(),t=nv[i];nv[i]=nv[j];nv[j]=t;try{await save(name,nv,'Urutkan '+name);arr=nv;listView()}catch(e){toast(e.message,1)}}});
    }
    function edit(i){
      var isNew=i<0,fields=resolveSel(S[name]);
      var obj=isNew?blankOf({f:fields}):JSON.parse(JSON.stringify(arr[i]));
      if(isNew&&name==='models'){obj.spesifikasi=[];obj.keunggulan=[];obj.galeri=[];obj.warna='#2563eb'}
      function draw(o){
        obj=o;
        main.innerHTML=head(isNew?'Tambah':'Ubah',esc(title),'<button class="btn" id="bk">Batal</button><button class="btn p" id="sv">Simpan</button>')+'<div class="card" id="fm">'+formHTML(fields,obj)+'</div>';
        bindMenu();$('bk').onclick=listView;
        $('sv').onclick=async function(){
          var o2=collect($('fm'),JSON.parse(JSON.stringify(obj)));
          var miss=fields.filter(function(f){return f.req&&!String(o2[f.k]||'').trim()});
          if(miss.length){toast('Isi dulu: '+miss[0].l,1);return}
          if(name==='models'){if(isNew){o2.slug=slugify(o2.nama);if(arr.some(function(x){return x.slug===o2.slug})){toast('Model dengan nama itu sudah ada',1);return}}else o2.slug=arr[i].slug;o2.galeri=o2.galeri||[];o2.model3d=o2.model3d||''}
          if(name==='testimoni'&&o2.rating!==undefined)o2.rating=String(o2.rating);
          var nv=arr.slice();if(isNew)nv.push(o2);else nv[i]=o2;
          busy(this);try{await save(name,nv,(isNew?'Tambah ':'Ubah ')+name+': '+titleOf(o2));arr=nv;toast('Tersimpan. Website dibangun ulang otomatis (±3 menit).');listView()}catch(e){toast(e.message,1);idle(this)}
        };
      }
      draw(obj);
      bindForm(main,function(){return obj},draw,fields);
    }
    listView();
  }catch(e){main.innerHTML=head(title,'')+'<div class="note">'+esc(e.message)+'</div>';bindMenu()}
}

async function vSettings(){
  main.innerHTML=head('Pengaturan Situs','Nama, kontak, lokasi, dan sosmed')+'<div class="card">Memuat...</div>';bindMenu();
  try{
    var d=await load('settings',{}),obj=JSON.parse(JSON.stringify(d.val)),fields=S.settings;
    function draw(o){
      obj=o;
      main.innerHTML=head('Pengaturan Situs','Nama, kontak, lokasi, dan sosmed','<button class="btn p" id="sv">Simpan</button>')+
      (!obj.whatsapp?'<div class="note" style="margin-bottom:14px">Nomor WhatsApp masih kosong, sehingga tombol WhatsApp di website belum berfungsi. Isi dulu.</div>':'')+
      '<div class="card" id="fm">'+formHTML(fields,obj)+'</div>';
      bindMenu();
      $('sv').onclick=async function(){
        var o2=collect($('fm'),JSON.parse(JSON.stringify(obj)));
        o2.whatsapp=String(o2.whatsapp||'').replace(/\D/g,'').replace(/^0/,'62');
        o2.namaLengkap=o2.namaSitus;o2.dealer=o2.namaSitus;
        busy(this);try{await save('settings',o2,'Ubah pengaturan situs');obj=o2;toast('Tersimpan');draw(o2)}catch(e){toast(e.message,1);idle(this)}
      };
    }
    draw(obj);bindForm(main,function(){return obj},draw,fields);
  }catch(e){main.innerHTML=head('Pengaturan','')+'<div class="note">'+esc(e.message)+'</div>';bindMenu()}
}

/* Prospek (disimpan hanya di browser ini, karena repo bersifat publik) */
function vLeads(){
  var L=JSON.parse(LS.get('m_leads')||'[]');
  var STA=['Baru','Follow up','Hot','Test drive','Deal','Batal'];
  function st(s){return s==='Hot'?'hot':s==='Deal'?'ok':s==='Batal'?'off':s==='Follow up'||s==='Test drive'?'warn':''}
  function persist(){LS.set('m_leads',JSON.stringify(L))}
  function list(){
    main.innerHTML=head('Prospek','Catatan calon pembeli','<button class="btn" id="ex">Ekspor CSV</button><button class="btn p" id="add">+ Prospek</button>')+
    '<div class="note b" style="margin-bottom:14px">Data prospek disimpan <b>hanya di browser ini</b> (bukan di GitHub) supaya nomor telepon pelanggan tidak terbuka di repository publik. Ekspor CSV berkala sebagai cadangan.</div>'+
    (L.length?'<div class="card" style="overflow:auto"><table><thead><tr><th>Nama</th><th>Minat</th><th>Status</th><th>Catatan</th><th></th></tr></thead><tbody>'+L.map(function(x,i){
      var wa=String(x.hp||'').replace(/\D/g,'').replace(/^0/,'62');
      return '<tr><td><b>'+esc(x.nama)+'</b><br><span style="color:var(--mut)">'+esc(x.hp)+'</span></td><td>'+esc(x.model||'-')+'<br><span style="color:var(--mut)">'+esc(x.sumber||'')+'</span></td><td><span class="tag '+st(x.status)+'">'+esc(x.status)+'</span></td><td>'+esc(x.catatan||'')+'</td><td style="white-space:nowrap">'+(wa?'<a class="btn s" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WA</a> ':'')+'<button class="btn s" data-e="'+i+'">Ubah</button> <button class="btn s d" data-d="'+i+'">✕</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="card" style="text-align:center;color:var(--mut)">Belum ada prospek.</div>');
    bindMenu();
    $('add').onclick=function(){form(-1)};
    $('ex').onclick=function(){
      var rows=[['Nama','HP','Model','Sumber','Status','Catatan','Tanggal']].concat(L.map(function(x){return[x.nama,x.hp,x.model,x.sumber,x.status,x.catatan,x.tgl]}));
      var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='prospek-geely-mai.csv';a.click();
    };
    main.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){form(+b.dataset.e)}});
    main.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Hapus prospek ini?')){L.splice(+b.dataset.d,1);persist();list()}}});
  }
  function form(i){
    var x=i<0?{nama:'',hp:'',model:'',sumber:'WhatsApp',status:'Baru',catatan:'',tgl:new Date().toISOString().slice(0,10)}:L[i];
    main.innerHTML=head(i<0?'Tambah prospek':'Ubah prospek','','<button class="btn" id="bk">Batal</button><button class="btn p" id="sv">Simpan</button>')+
    '<div class="card"><div class="two"><label class="f"><span>Nama *</span><input type="text" id="l1" value="'+esc(x.nama)+'"></label><label class="f"><span>No. HP / WhatsApp</span><input type="text" id="l2" value="'+esc(x.hp)+'"></label>'+
    '<label class="f"><span>Model diminati</span><select id="l3">'+['','Geely EX2','Geely EX5','Geely Starray EM-i','Belum tahu'].map(function(m){return '<option'+(m===x.model?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select></label>'+
    '<label class="f"><span>Sumber</span><select id="l4">'+['WhatsApp','Instagram','TikTok','Facebook','Website','Pameran','Referral','Lainnya'].map(function(m){return '<option'+(m===x.sumber?' selected':'')+'>'+m+'</option>'}).join('')+'</select></label>'+
    '<label class="f"><span>Status</span><select id="l5">'+STA.map(function(m){return '<option'+(m===x.status?' selected':'')+'>'+m+'</option>'}).join('')+'</select></label></div>'+
    '<label class="f"><span>Catatan</span><textarea id="l6">'+esc(x.catatan)+'</textarea></label></div>';
    bindMenu();$('bk').onclick=list;
    $('sv').onclick=function(){
      var n={nama:$('l1').value.trim(),hp:$('l2').value.trim(),model:$('l3').value,sumber:$('l4').value,status:$('l5').value,catatan:$('l6').value.trim(),tgl:x.tgl};
      if(!n.nama){toast('Nama wajib diisi',1);return}
      if(i<0)L.unshift(n);else L[i]=n;persist();toast('Tersimpan');list();
    };
  }
  list();
}

/* Upload ZIP */
function vZip(){
  main.innerHTML=head('Upload ZIP','Unggah paket website baru, lalu build otomatis')+
  '<div class="card"><div class="note b" style="margin-bottom:14px"><b>Cara kerja:</b> file ZIP dikirim ke halaman utama repository. Workflow GitHub mengekstraknya, menggabungkannya dengan data yang Anda ubah di panel ini, lalu menayangkan website.</div>'+
  '<label class="f"><span>Pilih file .zip (maks. sekitar 70 MB)</span><input type="file" id="zf" accept=".zip"></label><button class="btn p" id="zgo">Unggah &amp; jalankan build</button><div id="zs" style="margin-top:12px;color:var(--mut)"></div></div>';
  bindMenu();
  $('zgo').onclick=async function(){
    var f=$('zf').files[0];if(!f){toast('Pilih file ZIP dulu',1);return}
    if(f.size>70*1024*1024){toast('File terlalu besar untuk diunggah lewat panel',1);return}
    busy(this,'Mengunggah...');$('zs').textContent='Mengunggah '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)...';
    try{
      var name=slugify(f.name.replace(/\.zip$/i,''))||'paket';name+='.zip';
      var cur=null;try{cur=await gh('contents/'+name+'?ref='+encodeURIComponent(cfg().b))}catch(e){if(e.status!==404)throw e}
      var body={message:'Unggah paket '+name,content:await blobB64(f),branch:cfg().b};if(cur)body.sha=cur.sha;
      await gh('contents/'+name,{method:'PUT',body:JSON.stringify(body)});
      $('zs').textContent='Terunggah. Menjalankan build...';
      try{await gh('actions/workflows/deploy.yml/dispatches',{method:'POST',body:JSON.stringify({ref:cfg().b})})}catch(e){}
      $('zs').innerHTML='✅ Selesai. Tunggu 3-8 menit, lalu cek status di menu Ringkasan.';
    }catch(e){$('zs').textContent='';toast(e.message,1)}
    idle(this);
  };
}

/* ---------- router ---------- */
var TITLES={
  models:['Model & Harga','Kelola EX2, EX5, Starray dan model lain'],
  promo:['Promo','Penawaran yang tampil di halaman Promo'],
  slider:['Banner Beranda','Slide besar di bagian atas beranda'],
  testimoni:['Testimoni','Ulasan asli pelanggan'],
  delivery:['Serah Terima','Foto momen delivery']
};
function go(v){
  if(v==='out'){['m_o','m_r','m_b','m_t'].forEach(LS.del);CACHE={};$('app').classList.add('hide');$('login').classList.remove('hide');return}
  VIEW=v;$('side').classList.remove('open');
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='dash')vDash();else if(v==='settings')vSettings();else if(v==='leads')vLeads();else if(v==='zip')vZip();
  else vColl(v,TITLES[v][0],TITLES[v][1]);
  window.scrollTo(0,0);
}
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.v)});

function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');go('dash')}
$('lgo').onclick=async function(){
  var o=$('lo').value.trim(),r=$('lr').value.trim(),b=$('lb').value.trim()||'main',t=$('lt').value.trim();
  if(!o||!r||!t){toast('Lengkapi username, repo, dan token',1);return}
  LS.set('m_o',o);LS.set('m_r',r);LS.set('m_b',b);LS.set('m_t',t);
  var btn=this;busy(btn,'Memeriksa...');
  try{await gh('');showApp()}catch(e){toast(e.message,1)}
  idle(btn);
};
(function init(){
  var c=cfg();$('lo').value=c.o||'';$('lr').value=c.r||'';$('lb').value=c.b||'main';
  if(!c.o){var m=location.hostname.match(/^([^.]+)\.github\.io$/),p=location.pathname.split('/')[1];if(m){$('lo').value=m[1];if(p&&p!=='admin')$('lr').value=p}}
  if(c.o&&c.r&&c.t)showApp();
})();
})();
</script>
